name: Nightly balance

# AI-vs-AI duel matrix: every class against reference opponents, sides swapped.
# Slow (several minutes), so it runs at night and on demand – not on every push.
on:
  schedule:
    - cron: "17 2 * * *"   # 02:17 UTC every night
  workflow_dispatch:
    inputs:
      fights:
        description: "Duels per side and pairing (more = more precise, slower)"
        default: "12"

jobs:
  balance:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:balance -- --reporter=list,html
        env:
          CI: "true"
          FIGHTS: ${{ github.event.inputs.fights || '12' }}
      - name: Upload balance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: balance-report
          path: playwright-report/
          retention-days: 30

name: Deploy game to GitHub Pages

on:
  push:
    branches: [main, testing]
    paths:
      - "apps/game/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout main (root)
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-branch

      - name: Checkout testing (v2)
        uses: actions/checkout@v4
        with:
          ref: testing
          path: feature-branch
        continue-on-error: true

      - name: Assemble site
        run: |
          mkdir -p site
          cp -r main-branch/apps/game/. site/
          if [ -d feature-branch/apps/game ]; then
            mkdir -p site/v2
            cp -r feature-branch/apps/game/. site/v2/
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4

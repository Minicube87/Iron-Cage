    <circle cx="57" cy="18" r="7" fill="{{hair}}"></circle><circle cx="64" cy="24" r="6.5" fill="{{hair}}"></circle><circle cx="67.5" cy="32" r="5.2" fill="{{hair}}"></circle>
    <circle cx="44" cy="25" r="5" fill="{{hair}}"></circle><circle cx="54" cy="25" r="5" fill="{{hair}}"></circle>

  <sc-if value="{{rows}}" hint-placeholder-val="{{ false }}">

    <path d="M38 26.5 C38 21 39.5 17 42 15 M44.5 26 C44.5 20 45.5 15.5 47 14 M51 26 C51 20 51.5 15.5 52.5 13.8 M57.5 26.5 C57.5 21 58 17 59.5 15 M63.5 28.5 C64 24 64.5 20.5 65.5 18.5" stroke="#000" stroke-width="0.9" opacity="0.4" fill="none" stroke-linecap="round"></path>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"skin":{"editor":"color","default":"#D9A37A","options":["#F1D3BD","#D9A37A","#8D5A3B","#4A2C1A"]},"hairStyle":{"editor":"enum","default":"crop","options":["bald","buzz","crop","mohawk","curls","cornrows","bun"]},"hairColor":{"editor":"color","default":"#1E1714","options":["#1E1714","#5A3A22","#B8863B","#C9C4BB"]},"beard":{"editor":"enum","default":"stubble","options":["none","stubble","goatee","mustache","full"]},"extra":{"editor":"enum","default":"none","options":["none","scar","cauliflower","broken nose","tattoo"]},"bg":{"editor":"color","default":"#E5132B","options":["#E5132B","#2F6BFF","#F2B705","#16A34A"]},"size":{"editor":"int","default":220,"min":24,"max":400},"$preview":{"width":220,"height":220}}'>
class Component extends DCLogic {
  renderVals() {
    const mix = (hex, amt) => {
      const h = String(hex || '#888888').replace('#', '');
      const n = parseInt(h.length === 3 ? h.split('').map(c => c + c).join('') : h, 16);
      const f = c => Math.max(0, Math.min(255, Math.round(c * (1 - amt))));
      const r = f((n >> 16) & 255), g = f((n >> 8) & 255), b = f(n & 255);
      return '#' + [r, g, b].map(v => v.toString(16).padStart(2, '0')).join('');
    };
    const p = this.props;
    const skin = p.skin ?? '#D9A37A';
    const hairStyle = p.hairStyle ?? 'crop';
    const hair = p.hairColor ?? '#1E1714';
    const beard = p.beard ?? 'stubble';
    const extra = p.extra ?? 'none';
    const bg = p.bg ?? '#E5132B';
    const size = p.size ?? 220;
    return {
      sz: size + 'px',
      rad: Math.round(size * 0.18) + 'px',
      bgGrad: 'linear-gradient(155deg, ' + bg + ' 0%, ' + mix(bg, 0.55) + ' 100%)',
      skin, hair, shade: mix(skin, 0.18), brow: hairStyle === 'bald' ? mix(skin, 0.6) : mix(hair, 0.1),
      bald: hairStyle === 'bald', buzz: hairStyle === 'buzz', crop: hairStyle === 'crop', mohawk: hairStyle === 'mohawk',
      curls: hairStyle === 'curls', rows: hairStyle === 'cornrows', bun: hairStyle === 'bun',
      stubble: beard === 'stubble', full: beard === 'full', goatee: beard === 'goatee', stache: beard === 'mustache' || beard === 'goatee' || beard === 'full',
      scar: extra === 'scar', cauli: extra === 'cauliflower', earsPlain: extra !== 'cauliflower',
      noseBroken: extra === 'broken nose', noseStraight: extra !== 'broken nose', tattoo: extra === 'tattoo'
    };
  }
}
</script>
</body>
</html>

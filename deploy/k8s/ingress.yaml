apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-prefix
spec:
  stripPrefix:
    prefixes:
      - /iron-cage
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: iron-cage
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: iron-cage-strip-prefix@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: raspberrypi.fritz.box
      http:
        paths:
          - path: /iron-cage
            pathType: Prefix
            backend:
              service:
                name: iron-cage
                port:
                  number: 80
